# ==========================================
# Reservation System
# ==========================================

spring.application.name=reservation-system

# ==========================================
# Database Configuration
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservation_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# ==========================================
# Server
# ==========================================

server.port=${PORT:8080}
# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET:change-this-development-secret-before-production}

# ==========================================
# Logging / Correlation ID
# ==========================================

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-no-correlation-id}] [%thread] %logger{36} - %msg%n

# ============================================
# Flyway Database Migrations
# ============================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1