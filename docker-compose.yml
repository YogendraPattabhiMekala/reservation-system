services:

  postgres:
    image: postgres:16
    container_name: reservation-postgres

    environment:
      POSTGRES_DB: reservation_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservation_system"]
      interval: 5s
      timeout: 5s
      retries: 10


  reservation-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: reservation-app

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/reservation_system
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DDL_AUTO: update
      SHOW_SQL: "true"
      SERVER_PORT: 8080

    ports:
      - "8080:8080"


volumes:
  postgres-data: